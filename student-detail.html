'use strict';const client=window.supabase.createClient('https://vonuqedsenhnclxqpwnc.supabase.co','sb_publishable_dY0_xIWQN2iK6DJIAJ31zg_xdMsDhnl');const $=id=>document.getElementById(id);let lang=localStorage.getItem('minssem-language')==='en'?'en':'ko';let data=null,state='loading';const tr=(ko,en)=>lang==='ko'?ko:en;const sum=(a,k)=>a.reduce((n,x)=>n+(Number(x[k])||0),0);const pct=(c,n)=>n?Math.round(c/n*100)+'%':'—';const el=(tag,text,parent,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;if(parent)parent.append(e);return e};const mode=m=>({practice:tr('연습','Practice'),challenge:tr('도전','Challenge'),review:tr('오답 복습','Review'),wrong:tr('오답 복습','Review')})[m]||m;const date=x=>x?new Date(x).toLocaleString(lang==='ko'?'ko-KR':'en-US'):'—';const duration=x=>Math.floor(x/60)+tr('분 ','m ')+x%60+tr('초','s');
async function all(table,id){let out=[];for(let i=0;;i+=500){const {data,error}=await client.from(table).select('*').eq('user_id',id).order(table==='lesson_progress'?'lesson_number':'id').range(i,i+499);if(error)throw error;out.push(...data);if(data.length<500)return out;}}
function table(parent,title,headers,rows){const s=el('section',null,parent);el('h2',title,s);if(!rows.length){el('p',tr('기록이 없습니다.','No records yet.'),s);return}const w=el('div',null,s,'wrap'),t=el('table',null,w),h=el('tr',null,el('thead',null,t));headers.forEach(x=>el('th',x,h));const b=el('tbody',null,t);rows.forEach(row=>{const r=el('tr',null,b);row.forEach(x=>el('td',x??'—',r))});return s;}
function render(){document.documentElement.lang=lang;$('lang').value=lang;$('back').textContent=tr('← 관리자 페이지','← Admin Dashboard');$('name').textContent=data?data.profile.display_name:tr('학생 학습 상세','Student Learning Details');$('status').textContent=state==='loading'?tr('불러오는 중...','Loading...'):state==='denied'?tr('관리자 권한이 필요합니다.','Administrator access required.'):state==='error'?tr('기록 조회 실패. 권한 및 연결을 확인하세요.','Unable to load records. Check permissions and connection.'):'';const root=$('content');root.replaceChildren();root.hidden=!data;if(!data)return;const {progress,sessions,attempts}=data;const p=progress.filter(x=>x.course==='hsk1'),ss=sessions.filter(x=>x.course==='hsk1'&&x.completed_at),ids=new Set(ss.map(x=>x.id)),aa=attempts.filter(x=>ids.has(x.session_id));const g=el('section',null,root);el('h2',tr('HSK 1급 학습 요약','HSK 1 Summary'),g);const grid=el('div',null,g,'grid');[[tr('완료 단원','Completed lessons'),p.filter(x=>x.stars>0).length+'/15'],[tr('획득한 별','Stars'),sum(p,'stars')+'/45'],[tr('전체 정답률','Accuracy'),pct(sum(ss,'correct_count'),sum(ss,'total_questions'))],[tr('퀴즈 소요 시간','Quiz duration'),duration(sum(ss,'duration_seconds'))],[tr('완료 퀴즈','Completed quizzes'),ss.length]].forEach(([k,v])=>{const m=el('div',k,grid,'metric');el('strong',v,m)});table(root,tr('단원별 기록','Lesson records'),[tr('단원','Lesson'),tr('별','Stars'),tr('응시','Attempts'),tr('정답률','Accuracy')],Array.from({length:15},(_,i)=>{const n=i+1,s=ss.filter(x=>x.lesson_number===n);return [n,p.find(x=>x.lesson_number===n)?.stars||0,s.length,pct(sum(s,'correct_count'),sum(s,'total_questions'))]}));const map=new Map();aa.forEach(x=>{const k=x.word+'|'+(x.pinyin||'');if(!map.has(k))map.set(k,{x,n:0,w:0});const a=map.get(k);a.n++;if(!x.is_correct)a.w++});table(root,tr('오답 단어 분석','Incorrect word analysis'),[tr('단어','Word'),tr('병음','Pinyin'),tr('뜻','Meaning'),tr('오답/전체','Wrong/Total'),tr('정답률','Accuracy')],[...map.values()].filter(a=>a.w).sort((a,b)=>b.w-a.w).map(a=>[a.x.word,a.x.pinyin,lang==='ko'?a.x.meaning_ko:a.x.meaning_en,a.w+'/'+a.n,pct(a.n-a.w,a.n)]));table(root,tr('모드별 기록','Mode summary'),[tr('모드','Mode'),tr('횟수','Quizzes'),tr('정답률','Accuracy')],[...new Set(ss.map(x=>x.game_type))].map(m=>{const a=ss.filter(x=>x.game_type===m);return [mode(m),a.length,pct(sum(a,'correct_count'),sum(a,'total_questions'))]}));const sorted=[...ss].sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at));const s=el('section',null,root);el('h2',tr('퀴즈별 상세 응답','Quiz answer history'),s);if(!sorted.length){el('p',tr('기록이 없습니다.','No records yet.'),s);return}const sel=el('select',null,s);sorted.forEach(x=>{const o=el('option',date(x.completed_at)+' · Lesson '+x.lesson_number+' · '+mode(x.game_type)+' · '+pct(x.correct_count,x.total_questions),sel);o.value=x.id});const detail=el('div',null,s);function show(){detail.replaceChildren();table(detail,tr('문제별 응답','Question responses'),[tr('단어','Word'),tr('문제','Question'),tr('선택한 답','Selected answer'),tr('정답','Correct answer'),tr('결과','Result'),tr('응답 시간','Response time')],aa.filter(x=>x.session_id===sel.value).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(x=>[x.word,x.question_text||x.question_type,x.selected_answer??tr('미응답','No answer'),x.correct_answer,x.is_correct?tr('정답','Correct'):tr('오답','Incorrect'),x.response_time_ms==null?'—':(x.response_time_ms/1000).toFixed(1)+'s']))}sel.onchange=show;show();}
$('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('minssem-language',lang);render()};async function init(){render();try{const {data:u,error}=await client.auth.getUser();if(error||!u.user){state='denied';return}const {data:p,error:pe}=await client.from('profiles').select('role').eq('id',u.user.id).single();if(pe||p?.role!=='admin'){state='denied';return}const id=new URLSearchParams(location.search).get('id');if(!id||!/^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i.test(id))throw Error('Invalid ID');const {data:profile,error:e}=await client.from('profiles').select('display_name').eq('id',id).eq('role','student').single();if(e||!profile)throw Error('Student not found');const [progress,sessions,attempts]=await Promise.all(['lesson_progress','learning_sessions','question_attempts'].map(t=>all(t,id)));data={profile,progress,sessions,attempts};state='ready'}catch(e){console.error(e);state='error'}finally{render()}}init();
</script></body></html>
