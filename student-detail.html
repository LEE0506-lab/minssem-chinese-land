'use strict';const client=window.MinssemBackend.client;const $=id=>document.getElementById(id);let lang=localStorage.getItem('minssem-language')==='en'?'en':'ko';let data=null,state='loading',activeTab=0;const tr=(ko,en)=>lang==='ko'?ko:en;const sum=(a,k)=>a.reduce((n,x)=>n+(Number(x[k])||0),0);const pct=(c,n)=>n?Math.round(c/n*100)+'%':'—';const el=(tag,text,parent,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;if(parent)parent.append(e);return e};const mode=m=>({speed_quiz:tr('스피드 퀴즈','Speed Quiz'),word_match:tr('단어 매칭','Word Match'),listening_quiz:tr('듣기 퀴즈','Listening Quiz'),character_builder:tr('한자 조합','Character Builder'),practice:tr('연습','Practice'),challenge:tr('도전','Challenge'),review:tr('오답 복습','Review'),wrong:tr('오답 복습','Review')})[m]||m;const date=x=>x?new Date(x).toLocaleString(lang==='ko'?'ko-KR':'en-US'):'—';const duration=x=>Math.floor(x/60)+tr('분 ','m ')+x%60+tr('초','s');
async function all(table,id){let out=[];for(let i=0;;i+=500){const {data,error}=await client.from(table).select('*').eq('user_id',id).order(table==='lesson_progress'?'lesson_number':'id').range(i,i+499);if(error)throw error;out.push(...data);if(data.length<500)return out;}}
function table(parent,title,headers,rows){const s=el('section',null,parent);el('h2',title,s);if(!rows.length){el('p',tr('기록이 없습니다.','No records yet.'),s);return}const w=el('div',null,s,'wrap'),t=el('table',null,w),h=el('tr',null,el('thead',null,t));headers.forEach(x=>el('th',x,h));const b=el('tbody',null,t);rows.forEach(row=>{const r=el('tr',null,b);row.forEach(x=>el('td',x??'—',r))});return s;}
function render(){document.documentElement.lang=lang;$('lang').value=lang;$('back').textContent=tr('← 관리자 페이지','← Admin Dashboard');$('name').textContent=data?data.profile.display_name:tr('학생 학습 상세','Student Learning Details');$('status').textContent=state==='loading'?tr('불러오는 중...','Loading...'):state==='denied'?tr('관리자 권한이 필요합니다.','Administrator access required.'):state==='error'?tr('기록 조회 실패. 권한 및 연결을 확인하세요.','Unable to load records. Check permissions and connection.'):'';const root=$('content');root.replaceChildren();root.hidden=!data;if(!data)return;const {progress,sessions,attempts}=data;const p=progress,ss=sessions.filter(x=>x.course==='hsk1'&&x.completed_at),ids=new Set(ss.map(x=>x.id)),aa=attempts.filter(x=>ids.has(x.session_id));const tabs=el('div',null,root,'detail-tabs');const panels=Array.from({length:5},()=>document.createElement('div'));const labels=[tr('학습 현황','Overview'),tr('게임 통계','Game statistics'),tr('취약 단어','Weak words'),tr('평가 기록','Assessments'),tr('학습 활동','Activity')];const buttons=labels.map((label,i)=>{const b=el('button',label,tabs);b.type='button';b.onclick=()=>{activeTab=i;activate()};return b});function activate(){panels.forEach((p,i)=>{p.hidden=i!==activeTab;buttons[i].setAttribute('aria-pressed',String(i===activeTab))})}panels.forEach(p=>root.append(p));activate();const g=el('section',null,panels[0]);el('h2',tr('HSK 1급 학습 요약','HSK 1 Summary'),g);const grid=el('div',null,g,'grid');[[tr('완료 단원','Completed lessons'),p.completed+'/15'],[tr('획득한 별','Stars'),p.totalStars+'/45'],[tr('전체 정답률','Accuracy'),pct(sum(ss,'correct_count'),sum(ss,'total_questions'))],[tr('퀴즈 소요 시간','Quiz duration'),duration(sum(ss,'duration_seconds'))],[tr('완료 퀴즈','Completed quizzes'),ss.length]].forEach(([k,v])=>{const m=el('div',k,grid,'metric');el('strong',v,m)});AdminGames.mount(panels[1],sessions,attempts,new Map(),lang,true);table(panels[0],tr('단원별 기록','Lesson records'),[tr('단원','Lesson'),tr('별','Stars'),tr('응시','Attempts'),tr('정답률','Accuracy')],Array.from({length:15},(_,i)=>{const n=i+1,s=ss.filter(x=>x.lesson_number===n);return [n,p.stars[n-1],s.length,pct(sum(s,'correct_count'),sum(s,'total_questions'))]}));const map=new Map(),byId=new Map(ss.map(x=>[x.id,x])),order=['speed_quiz','word_match','listening_quiz','character_builder'];aa.forEach(x=>{const session=byId.get(x.session_id),k=JSON.stringify([session.lesson_number,x.word]);if(!map.has(k))map.set(k,{x,lesson:session.lesson_number,n:0,w:0,games:new Set()});const a=map.get(k);a.n++;if(!x.is_correct){a.w++;a.games.add(session.game_type==='challenge'||session.game_type==='practice'?'speed_quiz':session.game_type)}});const reviews=new Map((data.reviews||[]).map(x=>[JSON.stringify([x.lesson,x.word]),x]));table(panels[2],tr('오답 단어 분석','Incorrect word analysis'),[tr('단원','Lesson'),tr('단어','Word'),tr('병음','Pinyin'),tr('뜻','Meaning'),tr('오답/전체','Wrong/Total'),tr('오답 게임','Games'),tr('복습 진행','Review progress')],[...map.entries()].filter(([k,a])=>a.w).sort((a,b)=>b[1].w-a[1].w).map(([k,a])=>[a.lesson,a.x.word,a.x.pinyin,lang==='ko'?a.x.meaning_ko:a.x.meaning_en,a.w+'/'+a.n,order.filter(t=>a.games.has(t)).map(mode).join(' · ')||'—',reviews.has(k)?reviews.get(k).streak+'/3':'—']));el('p',tr('복습 진행률은 학생의 오답노트 조회 권한이 필요합니다. 기록이 없거나 조회할 수 없는 경우 —로 표시합니다.','Review progress requires access to student review records. Missing or unavailable records are shown as —.'),panels[2]);const assessment=el('section',null,panels[3]);el('h2',tr('평가 기록','Assessment records'),assessment);el('p',tr('Lesson Test · Section Test · Final Test — 준비 중','Lesson Test · Section Test · Final Test — Coming soon'),assessment);const sorted=[...ss].sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at));table(panels[4],tr('최근 학습 활동','Recent learning activity'),[tr('날짜','Date'),tr('단원','Lesson'),tr('게임','Game'),tr('정답률','Accuracy'),tr('시간','Duration')],sorted.map(x=>[date(x.completed_at),x.lesson_number,mode(x.game_type),pct(x.correct_count,x.total_questions),duration(x.duration_seconds)]));const s=el('section',null,panels[1]);el('h2',tr('퀴즈별 상세 응답','Quiz answer history'),s);if(!sorted.length){el('p',tr('기록이 없습니다.','No records yet.'),s);return}const sel=el('select',null,s);sorted.forEach(x=>{const o=el('option',date(x.completed_at)+' · Lesson '+x.lesson_number+' · '+mode(x.game_type)+' · '+pct(x.correct_count,x.total_questions),sel);o.value=x.id});const detail=el('div',null,s);function show(){detail.replaceChildren();table(detail,tr('문제별 응답','Question responses'),[tr('단어','Word'),tr('문제','Question'),tr('선택한 답','Selected answer'),tr('정답','Correct answer'),tr('결과','Result'),tr('응답 시간','Response time')],aa.filter(x=>x.session_id===sel.value).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(x=>[x.word,x.question_text||x.question_type,x.selected_answer??tr('미응답','No answer'),x.correct_answer,x.is_correct?tr('정답','Correct'):tr('오답','Incorrect'),x.response_time_ms==null?'—':(x.response_time_ms/1000).toFixed(1)+tr('초','s')]))}sel.onchange=show;show();}
$('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('minssem-language',lang);render()};async function init(){render();try{const {data:u,error}=await window.MinssemAuth.getUser();if(error||!u.user){state='denied';return}const {data:p,error:pe}=await window.MinssemAuth.getProfile(u.user.id);if(pe||p?.role!=='admin'){state='denied';return}const id=new URLSearchParams(location.search).get('id');if(!id||!/^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i.test(id))throw Error('Invalid ID');const {data:profile,error:e}=await client.from('profiles').select('display_name').eq('id',id).eq('role','student').single();if(e||!profile)throw Error('Student not found');const [progress,sessions,attempts]=await Promise.all([window.MinssemProgress.load({userId:id}),...['learning_sessions','question_attempts'].map(t=>all(t,id))]);let reviews=[];try{reviews=await all('vocabulary_reviews',id)}catch(e){console.warn('Review access unavailable',e)}data={profile,progress,sessions,attempts,reviews};state='ready'}catch(e){console.error(e);state='error'}finally{render()}}init();
