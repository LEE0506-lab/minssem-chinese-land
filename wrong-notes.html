<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 오답노트</title><link rel="stylesheet" href="language.css"><style>*{box-sizing:border-box}body{margin:0;background:#faf9f4;color:#263b36;font:16px/1.6 system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;background:white;padding:18px 7%;border-bottom:1px solid #dce5df}a{color:#107970;text-decoration:none;font-weight:700}main{max-width:900px;margin:auto;padding:30px 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border:1px solid #dce5df;border-radius:16px;padding:18px;margin:12px 0}.metric{font-size:28px;color:#107970;font-weight:700}button,select{font:inherit;border:1px solid #dce5df;border-radius:9px;padding:10px;background:white;color:#263b36}button{cursor:pointer}button.primary{background:#107970;color:white}button:disabled{opacity:.65;cursor:default}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.word{font-size:30px;font-weight:700}.muted{color:#657970}.bad{color:#b42318}.good{color:#107970}[hidden]{display:none!important}#choices{display:grid;gap:10px;margin:15px 0}@media(max-width:500px){.grid{gap:5px}.grid .card{padding:9px;font-size:12px}}</style></head><body><header><a href="index.html">✦ MINSSEM CHINESE</a><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select></header><main><a href="index.html" id="back"></a><h1 id="title"></h1><p id="status" role="status"></p><div id="content" hidden><div class="grid" id="metrics"></div><div class="row"><select id="filter"></select><button class="primary" id="start"></button></div><div id="quiz" class="card" hidden></div><div id="list"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const client=window.supabase.createClient('https://vonuqedsenhnclxqpwnc.supabase.co','sb_publishable_dY0_xIWQN2iK6DJIAJ31zg_xdMsDhnl');const $=id=>document.getElementById(id);let lang=localStorage.getItem('minssem-language')==='en'?'en':'ko',uid,words=[],pool=[],queue=[],current=null;const tr=(k,e)=>lang==='ko'?k:e;const node=(tag,txt,parent,cls)=>{const n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;if(parent)parent.append(n);return n};const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);function speak(w){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(w.word);u.lang='zh-CN';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}function meaning(w){return w['meaning_'+lang]||w.meaning_ko||w.meaning_en||''}function key(w){return w.lesson+'|'+w.word}async function all(t){let rows=[];for(let i=0;;i+=500){const {data,error}=await client.from(t).select('*').eq('user_id',uid).order('id').range(i,i+499);if(error)throw error;rows.push(...data);if(data.length<500)return rows}}async function load(){const [sessions,attempts,reviews]=await Promise.all(['learning_sessions','question_attempts','vocabulary_reviews'].map(all));const map=new Map(sessions.filter(s=>s.course==='hsk1').map(s=>[s.id,s]));const groups=new Map();for(const a of attempts){const s=map.get(a.session_id);if(!s||!a.word)continue;const w={...a,lesson:s.lesson_number};const k=key(w);if(!groups.has(k))groups.set(k,{...w,wrong:0,last:0});const g=groups.get(k);if(a.is_correct===false){g.wrong++;g.last=Math.max(g.last,Date.parse(a.created_at||s.started_at)||0)}}pool=[...groups.values()];const rm=new Map(reviews.map(r=>[key(r),r]));words=pool.filter(w=>w.wrong).map(w=>{const r=rm.get(key(w));return {...w,streak:r&&r.wrong_count===w.wrong?Math.min(3,r.streak):0}}).sort((a,b)=>b.wrong-a.wrong);render()}
function filtered(){return words.filter(w=>!$('filter').value||String(w.lesson)===$('filter').value)}function render(){const old=$('filter').value;$('filter').replaceChildren();for(const [v,t] of [['',tr('전체 단원','All lessons')],...Array.from({length:15},(_,i)=>[String(i+1),'Lesson '+(i+1)])]){const o=node('option',t,$('filter'));o.value=v}$('filter').value=old;$('metrics').replaceChildren();for(const [t,n] of [[tr('전체 오답 단어','Incorrect words'),words.length],[tr('복습 필요','Needs review'),words.filter(w=>w.streak<3).length],[tr('복습 완료','Mastered'),words.filter(w=>w.streak>=3).length]]){const c=node('div','',$('metrics'),'card');node('div',t,c);node('div',n,c,'metric')}$('list').replaceChildren();for(const w of filtered()){const c=node('div','',$('list'),'card'),r=node('div','',c,'row'),v=node('div','',r);node('div',w.word,v,'word');node('div',w.pinyin+' · '+meaning(w),v,'muted');const b=node('button','🔊',r);b.setAttribute('aria-label',tr('발음 듣기','Listen'));b.onclick=()=>speak(w);node('div',`Lesson ${w.lesson} · ${tr('오답','Incorrect')} ${w.wrong} · ${tr('복습','Review')} ${w.streak}/3`,c,w.streak===3?'good':'bad')}if(!filtered().length)node('p',tr('오답 기록이 없습니다.','No incorrect words yet.'),$('list'));$('start').disabled=!filtered().some(w=>w.streak<3);$('start').textContent=tr('오답 단어 복습 시작','Start review')}
function next(){const q=$('quiz');q.replaceChildren();current=queue.shift();if(!current){node('p',tr('복습 완료!','Review complete!'),q,'good');$('start').disabled=false;render();return}const w=current;node('p',tr('중국어 단어의 뜻을 선택하세요.','Choose the meaning of the Chinese word.'),q);node('div',w.word,q,'word');const opts=shuffle([meaning(w),...shuffle([...new Set(pool.map(meaning).filter(x=>x&&x!==meaning(w)))]).slice(0,3)]);const choices=node('div','',q);choices.id='choices';if(opts.length<2){const input=node('input','',choices);input.placeholder=tr('뜻을 입력하세요','Enter the meaning');const b=node('button',tr('확인','Check'),choices);b.onclick=()=>answer(input.value.trim().toLowerCase()===meaning(w).trim().toLowerCase(),choices,w)}else for(const o of opts){const b=node('button',o,choices);b.onclick=()=>answer(o===meaning(w),choices,w)}}async function answer(correct,choices,w){for(const b of choices.querySelectorAll('button,input'))b.disabled=true;const q=$('quiz');node('p',(correct?tr('정답!','Correct!'):tr('오답. 정답: ','Incorrect. Answer: '))+(!correct?meaning(w):''),q,correct?'good':'bad');const audio=node('button','🔊',q);audio.onclick=()=>speak(w);const streak=correct?Math.min(3,w.streak+1):0;const {error}=await client.from('vocabulary_reviews').upsert({user_id:uid,lesson:w.lesson,word:w.word,wrong_count:w.wrong,streak},{onConflict:'user_id,lesson,word'});if(error){node('p',tr('저장 실패. 다시 시도하세요.','Save failed. Try again.'),q,'bad');const b=node('button',tr('다시 시도','Retry'),q);b.onclick=()=>{b.disabled=true;answer(correct,choices,w)};return}w.streak=streak;render();$('start').disabled=true;const b=node('button',tr('다음','Next'),q,'primary');b.onclick=next} $('filter').onchange=render;$('start').onclick=()=>{queue=shuffle(filtered().filter(w=>w.streak<3)).slice(0,15);$('quiz').hidden=false;$('start').disabled=true;next();$('quiz').scrollIntoView({behavior:'smooth'})};$('lang').value=lang;$('lang').onchange=e=>{localStorage.setItem('minssem-language',e.target.value);location.reload()};document.documentElement.lang=lang;$('title').textContent=tr('나의 오답노트','My Review Notes');document.title=$('title').textContent;$('back').textContent=tr('← 메인 화면','← Home');(async()=>{try{$('status').textContent=tr('불러오는 중…','Loading…');const {data,error}=await client.auth.getUser();if(error||!data.user){location.href='login.html';return}uid=data.user.id;await load();$('content').hidden=false;$('status').textContent=tr('연속 3회 정답으로 복습을 완료하세요.','Answer correctly three times in a row to master a word.')}catch(e){console.error(e);$('status').textContent=tr('기록을 불러오지 못했습니다. 데이터베이스 설정을 확인하세요.','Unable to load records. Check database setup.')}})();</script></body></html>
