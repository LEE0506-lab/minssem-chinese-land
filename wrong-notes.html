<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 오답노트</title><link rel="stylesheet" href="language.css"><style>*{box-sizing:border-box}body{margin:0;background:#faf9f4;color:#263b36;font:16px/1.6 system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;background:white;padding:18px 7%;border-bottom:1px solid #dce5df}a{color:#107970;text-decoration:none;font-weight:700}main{max-width:900px;margin:auto;padding:30px 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border:1px solid #dce5df;border-radius:16px;padding:18px;margin:12px 0}.metric{font-size:28px;color:#107970;font-weight:700}button,select{font:inherit;border:1px solid #dce5df;border-radius:9px;padding:10px;background:white;color:#263b36}button{cursor:pointer}button.primary{background:#107970;color:white}button:disabled{opacity:.65;cursor:default}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.word{font-size:30px;font-weight:700}.muted{color:#657970}.bad{color:#b42318}.good{color:#107970}[hidden]{display:none!important}#choices{display:grid;gap:10px;margin:15px 0}@media(max-width:500px){.grid{gap:5px}.grid .card{padding:9px;font-size:12px}}.quiz-answer-audio { flex-shrink:0; width:44px; height:44px; display:grid; place-items:center; background:transparent; border:0; color:inherit; cursor:pointer; border-radius:10px; }
.quiz-answer-audio:hover { background:#e8f4ef; }
.quiz-answer-audio:focus-visible { outline:2px solid #107970; }
#quiz{padding:28px}#choices button{padding:16px;text-align:center}#choices button.correct{background:#e3f4e9;border-color:#21865b;color:#17623e;opacity:1}#choices button.wrong{background:#fde9e7;border-color:#c45245;color:#b42318;opacity:1}.progress{height:8px;background:#e5efeb;border-radius:8px;overflow:hidden;margin:12px 0 24px}.progress span{display:block;height:100%;background:#107970}.prompt{text-align:center;margin:24px 0}.prompt .word{font-size:44px}.answer-detail{border-top:1px solid #dce5df;padding-top:16px;margin-top:16px}.answer-detail .word{font-size:36px}.actions{margin-top:20px}#filter{padding-right:24px}@media(max-width:500px){#quiz{padding:16px}} </style></head><body><header><a href="index.html">✦ MINSSEM CHINESE</a><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select></header><main><a href="index.html" id="back"></a><h1 id="title"></h1><p id="status" role="status"></p><div id="content" hidden><div id="overview"><div class="grid" id="metrics"></div><div class="row"><select id="filter"></select><button class="primary" id="start"></button></div><div id="list"></div></div><div id="quiz" class="card" hidden></div></div></main><script src="audio.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const client=window.supabase.createClient('https://vonuqedsenhnclxqpwnc.supabase.co','sb_publishable_dY0_xIWQN2iK6DJIAJ31zg_xdMsDhnl');const $=id=>document.getElementById(id);let lang=localStorage.getItem('minssem-language')==='en'?'en':'ko',uid,words=[],pool=[],queue=[],current=null;const tr=(k,e)=>lang==='ko'?k:e;const node=(tag,txt,parent,cls)=>{const n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;if(parent)parent.append(n);return n};const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);


function speak(w){speakChinese(w.word)}
function audioButton(parent,w){const b=node("button","",parent,"quiz-answer-audio");b.type="button";b.setAttribute("aria-label",tr("발음 듣기","Listen to pronunciation"));b.title=tr("발음 듣기","Listen");b.innerHTML='<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></svg>';b.onclick=()=>speak(w);return b}
function meaning(w){return w['meaning_'+lang]||w.meaning_ko||w.meaning_en||''}function key(w){return w.lesson+'|'+w.word}async function all(t){let rows=[];for(let i=0;;i+=500){const {data,error}=await client.from(t).select('*').eq('user_id',uid).order('id').range(i,i+499);if(error)throw error;rows.push(...data);if(data.length<500)return rows}}async function load(){const [sessions,attempts,reviews]=await Promise.all(['learning_sessions','question_attempts','vocabulary_reviews'].map(all));const map=new Map(sessions.filter(s=>s.course==='hsk1').map(s=>[s.id,s]));const groups=new Map();for(const a of attempts){const s=map.get(a.session_id);if(!s||!a.word)continue;const w={...a,lesson:s.lesson_number};const k=key(w);if(!groups.has(k))groups.set(k,{...w,wrong:0,last:0});const g=groups.get(k);if(a.is_correct===false){g.wrong++;g.last=Math.max(g.last,Date.parse(a.created_at||s.started_at)||0)}}pool=[...groups.values()];const rm=new Map(reviews.map(r=>[key(r),r]));words=pool.filter(w=>w.wrong).map(w=>{const r=rm.get(key(w));return {...w,streak:r&&r.wrong_count===w.wrong?Math.min(3,r.streak):0}}).sort((a,b)=>b.wrong-a.wrong);render()}
function filtered(){return words.filter(w=>!$('filter').value||String(w.lesson)===$('filter').value)}function render(){const old=$('filter').value;$('filter').replaceChildren();for(const [v,t] of [['',tr('전체 단원','All lessons')],...Array.from({length:15},(_,i)=>[String(i+1),'Lesson '+(i+1)])]){const o=node('option',t,$('filter'));o.value=v}$('filter').value=old;$('metrics').replaceChildren();for(const [t,n] of [[tr('전체 오답 단어','Incorrect words'),words.length],[tr('복습 필요','Needs review'),words.filter(w=>w.streak<3).length],[tr('복습 완료','Mastered'),words.filter(w=>w.streak>=3).length]]){const c=node('div','',$('metrics'),'card');node('div',t,c);node('div',n,c,'metric')}$('list').replaceChildren();for(const w of filtered()){const c=node('div','',$('list'),'card'),r=node('div','',c,'row'),v=node('div','',r);node('div',w.word,v,'word');node('div',w.pinyin+' · '+meaning(w),v,'muted');audioButton(r,w);node('div',`Lesson ${w.lesson} · ${tr('오답','Incorrect')} ${w.wrong} · ${tr('복습','Review')} ${w.streak}/3`,c,w.streak===3?'good':'bad')}if(!filtered().length)node('p',tr('오답 기록이 없습니다.','No incorrect words yet.'),$('list'));$('start').disabled=!filtered().some(w=>w.streak<3);$('start').textContent=tr('오답 단어 복습 시작','Start review')}
let total=0,done=0,hits=0,misses=0,saving=false;
function home(){if(saving)return;queue=[];current=null;$('quiz').hidden=true;$('overview').hidden=false;$('status').hidden=false;$('title').textContent=tr('나의 오답노트','My Review Notes');render();window.scrollTo(0,0)}
function next(){const q=$('quiz');q.replaceChildren();current=queue.shift();if(!current){node('h2',tr('복습 완료!','Review complete!'),q,'good');node('p',`${tr('정답','Correct')} ${hits} / ${total} · ${tr('오답','Incorrect')} ${misses}`,q);node('p',`${tr('정답률','Accuracy')} ${Math.round(hits/total*100)}%`,q);const back=node('button',tr('오답노트로 돌아가기','Back to review notes'),q,'primary');back.onclick=home;return}
const w=current,top=node('div','',q,'row');node('strong',tr('오답 단어 집중 복습','Focused review'),top);const exit=node('button',tr('복습 종료','End review'),top);exit.onclick=()=>{if(!saving&&confirm(tr('복습을 종료할까요? 저장된 응답은 유지됩니다.','End review? Saved answers will be kept.')))home()};const stats=node('div','',q,'row');node('span',`${tr('문제','Question')} ${done+1} / ${total}`,stats,'muted');node('span',`${tr('정답','Correct')} ${hits} · ${tr('오답','Incorrect')} ${misses}`,stats,'muted');const bar=node('div','',q,'progress');node('span','',bar).style.width=(done/total*100)+'%';const prompt=node('div','',q,'prompt');node('p',tr('중국어 단어의 뜻을 선택하세요.','Choose the meaning of the Chinese word.'),prompt);node('div',w.word,prompt,'word');const opts=shuffle([meaning(w),...shuffle([...new Set(pool.map(meaning).filter(x=>x&&x!==meaning(w)))]).slice(0,3)]);const choices=node('div','',q);choices.id='choices';if(opts.length<2){const input=node('input','',choices);input.placeholder=tr('뜻을 입력하세요','Enter the meaning');const btn=node('button',tr('확인','Check'),choices);btn.onclick=()=>answer(input.value.trim().toLowerCase()===meaning(w).trim().toLowerCase(),choices,w,btn,exit)}else for(const o of opts){const btn=node('button',o,choices);btn.onclick=()=>answer(o===meaning(w),choices,w,btn,exit)}}
async function answer(correct,choices,w,selected,exit){if(saving)return;for(const btn of choices.querySelectorAll('button,input')){btn.disabled=true;if(btn.tagName==='BUTTON'&&btn.textContent===meaning(w))btn.classList.add('correct')}selected.classList.add(correct?'correct':'wrong');const q=$('quiz');const detail=node('div','',q,'answer-detail');node('strong',correct?tr('정답입니다!','Correct!'):tr('아쉬워요! 정답을 확인해 보세요.','Incorrect! Check the correct answer.'),detail,correct?'good':'bad');const row=node('div','',detail,'row'),v=node('div','',row);node('div',w.word,v,'word');node('div',(w.pinyin||'')+' · '+meaning(w),v,'muted');audioButton(row,w);const streak=correct?Math.min(3,w.streak+1):0;const actions=node('div','',q,'actions');async function save(){if(saving)return;saving=true;exit.disabled=true;$('lang').disabled=true;actions.replaceChildren();node('p',tr('저장 중…','Saving…'),actions,'muted');let error;try{({error}=await client.from('vocabulary_reviews').upsert({user_id:uid,lesson:w.lesson,word:w.word,wrong_count:w.wrong,streak},{onConflict:'user_id,lesson,word'}))}catch(e){error=e}finally{saving=false;exit.disabled=false;$('lang').disabled=false}actions.replaceChildren();if(error){node('p',tr('저장 실패. 다시 시도하세요.','Save failed. Try again.'),actions,'bad');node('button',tr('다시 시도','Retry'),actions).onclick=save;return}w.streak=streak;done++;if(correct)hits++;else misses++;node('button',done===total?tr('결과 보기','View results'):tr('다음 문제 →','Next question →'),actions,'primary').onclick=next}await save()}
$('filter').onchange=render;$('start').onclick=()=>{queue=shuffle(filtered().filter(w=>w.streak<3)).slice(0,15);if(!queue.length)return;total=queue.length;done=hits=misses=0;$('overview').hidden=true;$('status').hidden=true;$('title').textContent=tr('집중 복습','Focused review');$('quiz').hidden=false;next();window.scrollTo(0,0)};$('lang').value=lang;$('lang').onchange=e=>{localStorage.setItem('minssem-language',e.target.value);location.reload()};document.documentElement.lang=lang;$('title').textContent=tr('나의 오답노트','My Review Notes');document.title=$('title').textContent;$('back').textContent=tr('← 메인 화면','← Home');(async()=>{try{$('status').textContent=tr('불러오는 중…','Loading…');const {data,error}=await client.auth.getUser();if(error||!data.user){location.href='login.html';return}uid=data.user.id;await load();$('content').hidden=false;$('status').textContent=tr('연속 3회 정답으로 복습을 완료하세요.','Answer correctly three times in a row to master a word.')}catch(e){console.error(e);$('status').textContent=tr('기록을 불러오지 못했습니다. 데이터베이스 설정을 확인하세요.','Unable to load records. Check database setup.')}})();</script></body></html>
