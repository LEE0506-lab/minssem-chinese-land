
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 페이지 | 민쌤중국어 어휘랜드</title>
  <style>
    :root {
      --green: #0f766e;
      --bg: #fffcf7;
      --text: #263b36;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Noto Sans KR", Arial, sans-serif;
    }
    header {
      background: white;
      border-bottom: 1px solid #e3ebe6;
      padding: 20px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    a { color: var(--green); text-decoration: none; }
    .brand { font-weight: 800; font-size: 19px; }
    .tools { display: flex; gap: 12px; align-items: center; }
    select, button {
      padding: 10px 14px;
      border-radius: 10px;
      font: inherit;
      cursor: pointer;
    }
    select { border: 1px solid #dce8e2; background: white; }
    button { border: 0; background: var(--green); color: white; }
    main { max-width: 1080px; margin: auto; padding: 55px 24px; }
    h1 { font-size: 34px; }
    .muted { color: #71827c; line-height: 1.7; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 30px 0;
    }
    .card {
      background: white;
      border: 1px solid #e3ebe6;
      border-radius: 20px;
      padding: 25px;
    }
    .card h2 { font-size: 18px; margin-top: 0; }
    .number { font-size: 32px; font-weight: 800; color: var(--green); }
    .status { margin: 24px 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 14px;
      border-bottom: 1px solid #e3ebe6;
      text-align: left;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    th { background: #f4faf7; }
    .table-wrap { overflow-x: auto; }
    .hidden { display: none; }
    .error { color: #b42318; }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 27px; }
    }
  </style>
</head>
<body>
<header>
  <a href="index.html" class="brand">✦ MINSSEM CHINESE</a>
  <div class="tools">
    <select id="language">
      <option value="ko">한국어</option>
      <option value="en">English</option>
    </select>
    <button id="logout" class="hidden">로그아웃</button>
  </div>
</header>

<main>
  <p><a href="index.html" id="back">← 메인 화면</a></p>
  <h1 id="title">관리자 페이지</h1>
  <p class="muted" id="intro">학생 계정과 학습 현황을 관리하는 공간입니다.</p>
  <p id="status" class="status" role="status">관리자 권한을 확인하는 중...</p>

  <div id="dashboard" class="hidden">
    <div class="grid">
      <section class="card">
        <h2 id="studentHeading">등록된 학생</h2>
        <div id="studentCount" class="number">—</div>
      </section>
      <section class="card">
        <h2 id="inviteHeading">학생 초대</h2>
        <p class="muted" id="inviteNote">안전한 초대 기능 준비 중</p>
      </section>
      <section class="card">
        <h2 id="progressHeading">학습 진도</h2>
        <p class="muted" id="progressNote">학생별 진도 연동 준비 중</p>
      </section>
    </div>

    <section class="card">
      <h2 id="listHeading">학생 목록</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th id="nameHeading">이름</th>
              <th id="roleHeading">역할</th>
            </tr>
          </thead>
          <tbody id="students"></tbody>
        </table>
      </div>
      <p class="muted" id="listNote"></p>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";

const client = window.supabase.createClient(
  "https://vonuqedsenhnclxqpwnc.supabase.co",
  "sb_publishable_dY0_xIWQN2iK6DJIAJ31zg_xdMsDhnl"
);

const words = {
  ko: {
    back:"← 메인 화면", title:"관리자 페이지",
    intro:"학생 계정과 학습 현황을 관리하는 공간입니다.",
    loading:"관리자 권한을 확인하는 중...",
    denied:"관리자 권한이 없습니다. 관리자 계정으로 로그인해 주세요.",
    failed:"정보를 불러오지 못했습니다.",
    logout:"로그아웃", students:"등록된 학생",
    invite:"학생 초대", inviteNote:"안전한 초대 기능 준비 중",
    progress:"학습 진도", progressNote:"학생별 진도 연동 준비 중",
    list:"학생 목록", name:"이름", role:"역할",
    empty:"등록된 학생이 없습니다.",
    listError:"학생 목록 조회 권한을 확인해 주세요.",
    student:"학생"
  },
  en: {
    back:"← Back to Home", title:"Admin Dashboard",
    intro:"Manage student accounts and learning progress.",
    loading:"Checking administrator access...",
    denied:"Administrator access required. Please log in as an administrator.",
    failed:"Unable to load information.",
    logout:"Log Out", students:"Registered Students",
    invite:"Invite Students", inviteNote:"Secure invitations coming soon",
    progress:"Learning Progress", progressNote:"Student progress integration coming soon",
    list:"Student List", name:"Name", role:"Role",
    empty:"No students registered.",
    listError:"Please check permissions for viewing student profiles.",
    student:"Student"
  }
};

let lang = localStorage.getItem("minssem-language") === "en" ? "en" : "ko";
let studentRows = [];
let listError = false;

function t(key) { return words[lang][key]; }

function translate() {
  document.documentElement.lang = lang;
  document.getElementById("language").value = lang;
  const ids = {
    back:"back", title:"title", intro:"intro",
    logout:"logout", studentHeading:"students",
    inviteHeading:"invite", inviteNote:"inviteNote",
    progressHeading:"progress", progressNote:"progressNote",
    listHeading:"list", nameHeading:"name", roleHeading:"role"
  };
  Object.entries(ids).forEach(([id, key]) => {
    document.getElementById(id).textContent = t(key);
  });
  renderStudents();
}

function renderStudents() {
  const tbody = document.getElementById("students");
  tbody.replaceChildren();
  document.getElementById("studentCount").textContent =
    listError ? "—" : String(studentRows.length);

  for (const student of studentRows) {
    const row = document.createElement("tr");
    const name = document.createElement("td");
    const role = document.createElement("td");
    name.textContent = student.display_name || "—";
    role.textContent = t("student");
    row.append(name, role);
    tbody.appendChild(row);
  }

  document.getElementById("listNote").textContent =
    listError ? t("listError") :
    studentRows.length === 0 ? t("empty") : "";
}

document.getElementById("language").addEventListener("change", e => {
  lang = e.target.value;
  localStorage.setItem("minssem-language", lang);
  translate();
});

document.getElementById("logout").addEventListener("click", async () => {
  const button = document.getElementById("logout");
  button.disabled = true;
  const { error } = await client.auth.signOut();
  if (error) {
    button.disabled = false;
    document.getElementById("status").textContent = t("failed");
    return;
  }
  window.location.replace("login.html");
});

async function init() {
  const status = document.getElementById("status");
  status.textContent = t("loading");

  try {
    const { data, error } = await client.auth.getUser();
    if (error || !data.user) {
      status.textContent = t("denied");
      return;
    }

    const { data: profile, error: profileError } = await client
      .from("profiles")
      .select("role")
      .eq("id", data.user.id)
      .single();

    if (profileError || profile?.role !== "admin") {
      status.textContent = t("denied");
      return;
    }

    document.getElementById("dashboard").classList.remove("hidden");
    document.getElementById("logout").classList.remove("hidden");
    status.textContent = "";

    const { data: students, error: studentsError } = await client
      .from("profiles")
      .select("id, display_name, role")
      .eq("role", "student")
      .order("display_name");

    listError = Boolean(studentsError);
    studentRows = studentsError ? [] : (students || []);
    if (studentsError) console.error(studentsError);
    renderStudents();
  } catch (error) {
    console.error(error);
    status.textContent = t("failed");
  }
}

translate();
init();
</script>
</body>
</html>
