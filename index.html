
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>민쌤중국어 어휘랜드</title>
  <style>
    :root {
      --primary: #0F766E;
      --primary-light: #E5F4EF;
      --background: #FFFCF7;
      --text: #263B36;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Noto Sans KR", sans-serif;
    }

    header {
      padding: 20px 8%;
      background: white;
      border-bottom: 1px solid #E8EEEA;
      font-weight: 800;
      color: var(--primary);
      font-size: 20px;
    }

    main {
      max-width: 1080px;
      margin: auto;
      padding: 70px 24px;
    }

    .eyebrow {
      color: var(--primary);
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 13px;
    }

    h1 {
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.3;
      margin: 20px 0;
    }

    .intro {
      font-size: 18px;
      color: #71827C;
      line-height: 1.8;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 16px 28px;
      background: var(--primary);
      color: white;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
    }

    .section-title {
      margin-top: 55px;
      font-size: 26px;
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 25px;
    }

    .course {
      padding: 30px;
      background: white;
      border: 1px solid #E3EBE6;
      border-radius: 22px;
    }

    .course-icon {
      font-size: 34px;
      margin-bottom: 18px;
    }

    .course h3 { margin: 0 0 12px; }

    .course p {
      color: #7B8983;
      font-size: 14px;
      line-height: 1.6;
    }

    .course a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .disabled { opacity: 0.5; }

    footer {
      text-align: center;
      padding: 45px 20px;
      color: #9AA8A0;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      main { padding: 45px 20px; }
      .courses { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>✦ 민쌤중국어 어휘랜드</header>

<main>
  <section>
    <div class="eyebrow">MINSSem CHINESE VOCABULARY LAND</div>
    <h1>중국어 단어 공부,<br>이제 모험처럼 즐겁게!</h1>
    <p class="intro">
      단어를 배우고, 게임에 도전하고,<br>
      별을 모아 새로운 스테이지를 열어보세요.
    </p>
  </section>

  <section id="courses">
    <h2 class="section-title">학습 코스 선택</h2>

    <div class="courses">
      <div class="course">
        <div class="course-icon">📗</div>
        <h3>HSK 3.0</h3>
        <p>급수별·과별 단어 학습과 게임형 테스트</p>
        <a href="hsk.html">학습 시작하기 →</a>
      </div>

      <div class="course disabled">
        <div class="course-icon">🎓</div>
        <h3>IB Chinese</h3>
        <p>IB Chinese B 어휘 학습 코스</p>
        <p>추후 오픈</p>
      </div>

      <div class="course disabled">
        <div class="course-icon">🌏</div>
        <h3>AP Chinese</h3>
        <p>AP Chinese 어휘 학습 코스</p>
        <p>추후 오픈</p>
      </div>
    </div>
  </section>
</main>

<footer>© 2026 민쌤중국어 어휘랜드</footer>

</body>
</html>
