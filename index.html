
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>민쌤중국어 어휘랜드</title>

  <style>
    :root {
      --primary: #0F766E;
      --primary-light: #E5F4EF;
      --background: #FFFCF7;
      --text: #263B36;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Noto Sans KR", sans-serif;
    }

    header {
      padding: 20px 8%;
      background: white;
      border-bottom: 1px solid #E8EEEA;
      font-weight: 800;
      color: var(--primary);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      min-width: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .language-select {
      border: 1px solid #DCE8E2;
      background: white;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .language-select:focus-visible {
      outline: 3px solid #8BCDBD;
      outline-offset: 2px;
    }

    .auth-area {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .auth-button {
      display: inline-block;
      padding: 10px 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
    }

    .auth-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .auth-name {
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .auth-link {
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .auth-logout {
      background: var(--primary-light);
      color: var(--primary);
    }

    main {
      max-width: 1080px;
      margin: auto;
      padding: 70px 24px;
    }

    .eyebrow {
      color: var(--primary);
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 13px;
    }

    h1 {
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.3;
      margin: 20px 0;
    }

    .intro {
      font-size: 18px;
      color: #71827C;
      line-height: 1.8;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 16px 28px;
      background: var(--primary);
      color: white;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
    }

    .section-title {
      margin-top: 55px;
      font-size: 26px;
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 25px;
    }

    .course {
      padding: 30px;
      background: white;
      border: 1px solid #E3EBE6;
      border-radius: 22px;
    }

    .course-icon {
      font-size: 34px;
      margin-bottom: 18px;
    }

    .course h3 {
      margin: 0 0 12px;
    }

    .course p {
      color: #7B8983;
      font-size: 14px;
      line-height: 1.6;
    }

    .course a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .disabled {
      opacity: 0.5;
    }

    footer {
      text-align: center;
      padding: 45px 20px;
      color: #9AA8A0;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      header {
        padding: 16px 20px;
        font-size: 15px;
        align-items: flex-start;
      }

      .header-right {
        gap: 8px;
      }

      .language-select {
        font-size: 12px;
        padding: 9px;
      }

      .auth-area {
        gap: 8px;
      }

      .auth-name,
      .auth-link {
        font-size: 12px;
      }

      .auth-button {
        padding: 9px 12px;
        font-size: 12px;
      }

      main {
        padding: 45px 20px;
      }

      .courses {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand" id="brand">
    ✦ 민쌤중국어 어휘랜드
  </div>

  <div class="header-right">

    <select
      id="minssemLanguage"
      class="language-select"
      aria-label="Language / 언어"
    >
      <option value="ko">한국어</option>
      <option value="en">English</option>
    </select>

    <div id="authArea" class="auth-area">
      <!-- 로그인 상태를 확인한 후 버튼을 표시합니다. -->
    </div>

  </div>
</header>

<main>

  <section>
    <div class="eyebrow">
      MINSSEM CHINESE VOCABULARY LAND
    </div>

    <h1 id="heroTitle">
      중국어 단어 공부,<br>
      이제 모험처럼 즐겁게!
    </h1>

    <p class="intro" id="heroIntro">
      단어를 배우고, 게임에 도전하고,<br>
      별을 모아 새로운 스테이지를 열어보세요.
    </p>
  </section>

  <section id="courses">

    <h2 class="section-title" id="courseTitle">
      학습 코스 선택
    </h2>

    <div class="courses">

      <div class="course">
        <div class="course-icon">📗</div>
        <h3>HSK 3.0</h3>

        <p id="hskDescription">
          급수별·과별 단어 학습과 게임형 테스트
        </p>

        <a href="hsk.html" id="startLink">
          학습 시작하기 →
        </a>
      </div>

      <div class="course disabled">
        <div class="course-icon">🎓</div>
        <h3>IB Chinese</h3>

        <p id="ibDescription">
          IB Chinese B 어휘 학습 코스
        </p>

        <p class="comingSoon">
          추후 오픈
        </p>
      </div>

      <div class="course disabled">
        <div class="course-icon">🌏</div>
        <h3>AP Chinese</h3>

        <p id="apDescription">
          AP Chinese 어휘 학습 코스
        </p>

        <p class="comingSoon">
          추후 오픈
        </p>
      </div>

    </div>
  </section>

</main>

<footer id="footer">
  © 2026 민쌤중국어 어휘랜드
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
  "use strict";

  // ==========================================
  // 1. Supabase 설정
  // ==========================================

  const SUPABASE_URL =
    "https://vonuqedsenhnclxqpwnc.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dY0_xIWQN2iK6DJIAJ31zg_xdMsDhnl";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  // ==========================================
  // 2. 언어 설정
  // ==========================================

  const LANGUAGE_KEY = "minssem-language";

  const translations = {
    ko: {
      brand: "✦ 민쌤중국어 어휘랜드",
      heroTitle:
        "중국어 단어 공부,<br>이제 모험처럼 즐겁게!",
      heroIntro:
        "단어를 배우고, 게임에 도전하고,<br>별을 모아 새로운 스테이지를 열어보세요.",
      courseTitle: "학습 코스 선택",
      hskDescription:
        "급수별·과별 단어 학습과 게임형 테스트",
      startLink: "학습 시작하기 →",
      ibDescription: "IB Chinese B 어휘 학습 코스",
      apDescription: "AP Chinese 어휘 학습 코스",
      comingSoon: "추후 오픈",
      footer: "© 2026 민쌤중국어 어휘랜드",
      login: "로그인",
      logout: "로그아웃",
      adminPage: "관리자 페이지",
      myProgress: "내 학습 기록",
      user: "사용자"
    },

    en: {
      brand: "✦ Min's Chinese Vocabulary Land",
      heroTitle:
        "Learning Chinese Vocabulary,<br>Now an Exciting Adventure!",
      heroIntro:
        "Learn new words, take on challenges,<br>collect stars, and unlock new stages.",
      courseTitle: "Choose Your Learning Course",
      hskDescription:
        "Vocabulary lessons and game-based quizzes by HSK level and lesson",
      startLink: "Start Learning →",
      ibDescription:
        "Vocabulary learning course for IB Chinese B",
      apDescription:
        "Vocabulary learning course for AP Chinese",
      comingSoon: "Coming Soon",
      footer: "© 2026 Min's Chinese Vocabulary Land",
      login: "Log In",
      logout: "Log Out",
      adminPage: "Admin Dashboard",
      myProgress: "My Progress",
      user: "User"
    }
  };

  function getSavedLanguage() {
    try {
      return localStorage.getItem(LANGUAGE_KEY) === "en"
        ? "en"
        : "ko";
    } catch (error) {
      return "ko";
    }
  }

  let currentLanguage = getSavedLanguage();
  let currentProfile = null;

  function t(key) {
    return translations[currentLanguage][key];
  }

  function setLanguage(language) {
    currentLanguage = language === "en" ? "en" : "ko";

    document.documentElement.lang = currentLanguage;

    document.getElementById("minssemLanguage").value =
      currentLanguage;

    [
      "brand",
      "heroTitle",
      "heroIntro",
      "courseTitle",
      "hskDescription",
      "startLink",
      "ibDescription",
      "apDescription",
      "footer"
    ].forEach(id => {
      const element = document.getElementById(id);

      if (id === "heroTitle" || id === "heroIntro") {
        element.innerHTML = t(id);
      } else {
        element.textContent = t(id);
      }
    });

    document.querySelectorAll(".comingSoon")
      .forEach(element => {
        element.textContent = t("comingSoon");
      });

    try {
      localStorage.setItem(
        LANGUAGE_KEY,
        currentLanguage
      );
    } catch (error) {
      console.warn("Language preference not saved.");
    }

    renderAuthArea();
  }

  document.getElementById("minssemLanguage")
    .addEventListener("change", function () {
      setLanguage(this.value);
    });

  // ==========================================
  // 3. 로그인 상태에 따른 메뉴
  // ==========================================

  function renderAuthArea() {
    const area = document.getElementById("authArea");

    area.replaceChildren();

    // 로그인하지 않은 경우
    if (!currentProfile) {
      const login = document.createElement("a");

      login.href = "login.html";
      login.className = "auth-button";
      login.textContent = t("login");

      area.appendChild(login);
      return;
    }

    // 로그인한 사용자 이름
    const name = document.createElement("span");

    name.className = "auth-name";
    name.textContent =
      currentProfile.display_name || t("user");

    area.appendChild(name);

    // 관리자 계정
    if (currentProfile.role === "admin") {
      const adminLink = document.createElement("a");

      adminLink.href = "admin.html";
      adminLink.className = "auth-link";
      adminLink.textContent = t("adminPage");

      area.appendChild(adminLink);
    }

    // 학생 계정
    if (currentProfile.role === "student") {
      const progressLink = document.createElement("a");

      progressLink.href = "progress.html";
      progressLink.className = "auth-link";
      progressLink.textContent = t("myProgress");

      area.appendChild(progressLink);
    }

    // 로그아웃 버튼
    const logout = document.createElement("button");

    logout.type = "button";
    logout.className = "auth-button auth-logout";
    logout.textContent = t("logout");

    logout.addEventListener("click", async () => {
      logout.disabled = true;

      const { error } =
        await supabaseClient.auth.signOut();

      if (error) {
        console.error("Logout failed:", error);
        logout.disabled = false;
        return;
      }

      currentProfile = null;
      renderAuthArea();
    });

    area.appendChild(logout);
  }

  // ==========================================
  // 4. Supabase 사용자 정보 불러오기
  // ==========================================

  async function loadAuthState() {
    try {
      const { data, error } =
        await supabaseClient.auth.getUser();

      if (error || !data.user) {
        currentProfile = null;
        renderAuthArea();
        return;
      }

      const { data: profile, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select("display_name, role")
          .eq("id", data.user.id)
          .single();

      if (
        profileError ||
        !profile ||
        !["admin", "student"].includes(profile.role)
      ) {
        console.warn(
          "Profile unavailable:",
          profileError?.message
        );

        currentProfile = null;
        renderAuthArea();
        return;
      }

      currentProfile = profile;
      renderAuthArea();

    } catch (error) {
      console.error("Authentication check failed:", error);

      currentProfile = null;
      renderAuthArea();
    }
  }

  // 로그인 또는 로그아웃 상태 변경 감지
  supabaseClient.auth.onAuthStateChange(() => {
    setTimeout(() => {
      loadAuthState();
    }, 0);
  });

  // ==========================================
  // 5. 페이지 시작
  // ==========================================

  setLanguage(getSavedLanguage());
  loadAuthState();

</script>

</body>
</html>
