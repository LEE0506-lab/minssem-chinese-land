
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | 민쌤중국어 어휘랜드</title>
  <style>
    :root {
      --green: #0f766e;
      --background: #f8fffc;
      --text: #263b36;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont,
        "Noto Sans KR", Arial, sans-serif;
      background: linear-gradient(145deg, #effcf6, #ffffff);
      color: var(--text);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 6%;
    }

    .brand {
      font-weight: 800;
      color: var(--green);
      text-decoration: none;
      font-size: 17px;
    }

    select {
      padding: 9px 12px;
      border: 1px solid #cbded5;
      border-radius: 10px;
      background: white;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 55px 20px;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 38px 32px;
      border-radius: 24px;
      box-shadow: 0 15px 50px rgba(20, 80, 60, 0.09);
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--green);
      font-weight: 800;
    }

    h1 {
      font-size: 29px;
      margin: 12px 0;
    }

    .intro {
      color: #73847e;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d6e3dc;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 22px;
    }

    input:focus {
      outline: 2px solid #99e2c3;
      border-color: var(--green);
    }

    button {
      width: 100%;
      padding: 15px;
      background: var(--green);
      border: none;
      color: white;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      min-height: 20px;
    }

    .error { color: #c0392b; }
    .success { color: var(--green); }

    .back {
      display: block;
      margin-top: 25px;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      color: #73847e;
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="brand">
    🌱 MINSS​EM CHINESE
  </a>

  <select id="languageSelect" aria-label="Language">
    <option value="ko">한국어</option>
    <option value="en">English</option>
  </select>
</header>

<main>
  <div class="card">
    <div class="eyebrow">MINSS​EM CHINESE VOCABULARY LAND</div>

    <h1 id="title">로그인</h1>

    <p class="intro" id="intro">
      민쌤중국어 어휘랜드에 오신 것을 환영합니다.
      선생님이 등록한 계정으로 로그인해 주세요.
    </p>

    <form id="loginForm">
      <label for="email" id="emailLabel">이메일</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="example@email.com"
        required
      >

      <label for="password" id="passwordLabel">비밀번호</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        로그인
      </button>
    </form>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

    <a href="index.html" class="back" id="backLink">
      ← 메인 화면으로 돌아가기
    </a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
  const SUPABASE_URL =
    "https://vonuqedsenhnclxqpwnc.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dY0_xIWQN2iK6DJIAJ31zg_xdMsDhnl";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const translations = {
    ko: {
      title: "로그인",
      intro: "민쌤중국어 어휘랜드에 오신 것을 환영합니다. 선생님이 등록한 계정으로 로그인해 주세요.",
      email: "이메일",
      password: "비밀번호",
      login: "로그인",
      loading: "로그인 중...",
      back: "← 메인 화면으로 돌아가기",
      success: "로그인 성공! 메인 화면으로 이동합니다.",
      invalid: "이메일 또는 비밀번호를 확인해 주세요.",
      notRegistered: "등록된 사용자 정보를 찾을 수 없습니다. 관리자에게 문의해 주세요.",
      error: "로그인 중 오류가 발생했습니다. 다시 시도해 주세요."
    },
    en: {
      title: "Log In",
      intro: "Welcome to Minssem Chinese Vocabulary Land. Please log in with the account provided by your teacher.",
      email: "Email",
      password: "Password",
      login: "Log In",
      loading: "Logging in...",
      back: "← Back to Home",
      success: "Login successful! Redirecting...",
      invalid: "Please check your email or password.",
      notRegistered: "Your profile was not found. Please contact your teacher.",
      error: "An error occurred. Please try again."
    }
  };

  const languageSelect =
    document.getElementById("languageSelect");

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");

  let language =
    localStorage.getItem("minssem-language") || "ko";

  if (!translations[language]) language = "ko";

  function t(key) {
    return translations[language][key];
  }

  function updateLanguage() {
    document.documentElement.lang = language;
    languageSelect.value = language;

    document.getElementById("title").textContent = t("title");
    document.getElementById("intro").textContent = t("intro");
    document.getElementById("emailLabel").textContent = t("email");
    document.getElementById("passwordLabel").textContent = t("password");
    document.getElementById("backLink").textContent = t("back");

    if (!loginButton.disabled) {
      loginButton.textContent = t("login");
    }
  }

  languageSelect.addEventListener("change", () => {
    language = languageSelect.value;
    localStorage.setItem("minssem-language", language);
    updateLanguage();
  });

  function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = "message " + type;
  }

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    loginButton.disabled = true;
    loginButton.textContent = t("loading");
    showMessage("");

    try {
      const { data, error } =
        await client.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        showMessage(t("invalid"));
        return;
      }

      const user = data.user;

const { data: profile, error: profileError } =
  await client
    .from("profiles")
    .select("id, display_name, role")
    .eq("id", user.id)
    .maybeSingle();

if (profileError) {
  console.error("Profile query error:", profileError);
  showMessage(
    language === "ko"
      ? "프로필 조회 오류: " + profileError.message
      : "Profile query error: " + profileError.message
  );
  return;
}

if (!profile) {
  console.warn("No profile for user:", user.id);
  showMessage(t("notRegistered"));
  return;
}

if (!["admin", "student"].includes(profile.role)) {
  showMessage(
    language === "ko"
      ? "계정 권한을 확인할 수 없습니다."
      : "Your account role is not valid."
  );
  return;
}

      showMessage(t("success"), "success");

      window.location.replace("index.html");

    } catch (error) {
      console.error("Login error:", error);
      showMessage(t("error"));

    } finally {
      loginButton.disabled = false;
      loginButton.textContent = t("login");
    }
  });

  updateLanguage();
</script>

</body>
</html>
