
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK 1급 모험 지도 | 민쌤중국어</title>
<style>
:root {
  --green:#0F766E;
  --cream:#FFFCF7;
  --ink:#263B36;
  --muted:#81918A;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,
    "Noto Sans KR",sans-serif;
}
header {
  background:white;
  padding:20px 8%;
  border-bottom:1px solid #E8EEEA;
}
header a {
  color:var(--green);
  font-size:20px;
  font-weight:800;
  text-decoration:none;
}
main {
  max-width:820px;
  margin:auto;
  padding:40px 20px 90px;
}
.back {
  color:var(--muted);
  font-size:14px;
  text-decoration:none;
}
.hero {
  margin-top:35px;
  background:#E9F5F1;
  border-radius:25px;
  padding:30px;
}
.eyebrow {
  color:var(--green);
  font-size:12px;
  font-weight:800;
  letter-spacing:2px;
}
h1 {
  font-size:clamp(28px,5vw,39px);
  margin:12px 0;
}
.hero p {
  color:#668078;
  line-height:1.7;
}
.stats {
  display:flex;
  gap:20px;
  font-weight:800;
  margin-top:22px;
}
.map {
  position:relative;
  max-width:520px;
  margin:55px auto 0;
}
.lesson {
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:35px;
}
.lesson:nth-child(even) {
  transform:translateX(65px);
}
.lesson:nth-child(odd) {
  transform:translateX(-65px);
}
.node {
  display:grid;
  place-items:center;
  width:92px;
  height:92px;
  border-radius:50%;
  border:5px solid #DCE7E1;
  background:#F1F4F1;
  font-size:34px;
  color:#9DAAA3;
}
.lesson.active .node {
  background:var(--green);
  border-color:#B6DED1;
  color:white;
  box-shadow:0 7px 0 #095A54;
}
.lesson h2 {
  margin:18px 0 6px;
  font-size:19px;
}
.chinese {
  font-family:"Kaiti SC","KaiTi","STKaiti",serif;
  font-size:22px;
}
.lesson p {
  margin:5px 0;
  font-size:13px;
  color:var(--muted);
}
.stars {
  color:#D6A32B;
  font-size:23px;
  letter-spacing:3px;
  margin:10px 0;
}
.start {
  display:inline-block;
  margin-top:10px;
  background:var(--green);
  color:white;
  padding:12px 20px;
  border-radius:12px;
  font-size:14px;
  font-weight:800;
  text-decoration:none;
}
.path {
  width:3px;
  height:35px;
  background:#DDE8E1;
  margin:0 auto 30px;
}
.note {
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}
@media(max-width:550px) {
  .lesson:nth-child(even) {transform:translateX(28px)}
  .lesson:nth-child(odd) {transform:translateX(-28px)}
  .hero {padding:23px}
  .node {width:80px;height:80px}
}
</style>
</head>
<body>

<header>
  <a href="index.html">✦ 민쌤중국어 어휘랜드</a>
</header>

<main>
  <a href="hsk.html" class="back">← HSK 급수 선택으로</a>

  <section class="hero">
    <div class="eyebrow">HSK 3.0 · LEVEL 1</div>
    <h1>🌱 HSK 1급 모험 지도</h1>
    <p>
      한 과씩 도전하며 중국어 실력을 키워보세요.<br>
      별을 획득하면 다음 과가 열립니다!
    </p>
    <div class="stats">
      <span id="stars">⭐ 0개</span>
      <span id="completed">📚 완료한 과 0개</span>
    </div>
  </section>

  <div class="map" id="lesson-map"></div>

  <p class="note">
    제1과부터 시작해 보세요!<br>
    이후 과는 이전 과를 완료하면 해금됩니다.
  </p>
</main>

<script>
const lessons = [
  {number:1,title:"AI小语，你好！"},
  {number:2,title:"제2과"},
  {number:3,title:"제3과"},
  {number:4,title:"제4과"},
  {number:5,title:"제5과"},
  {number:6,title:"제6과"},
  {number:7,title:"제7과"},
  {number:8,title:"제8과"},
  {number:9,title:"제9과"},
  {number:10,title:"제10과"},
  {number:11,title:"제11과"},
  {number:12,title:"제12과"},
  {number:13,title:"제13과"},
  {number:14,title:"제14과"},
  {number:15,title:"제15과"}
];

const key="minssem-hsk1-progress";

let progress;
try {
  progress=JSON.parse(localStorage.getItem(key)) || {};
} catch(e) {
  progress={};
}

const stars=Array.isArray(progress.stars)
  ? progress.stars : Array(15).fill(0);

const total=stars.reduce((sum,n)=>
  sum+(Number.isFinite(n)?Math.min(3,Math.max(0,n)):0),0
);

const completed=stars.filter(n=>n>=1).length;

document.getElementById("stars").textContent=
  `⭐ ${total}개`;

document.getElementById("completed").textContent=
  `📚 완료한 과 ${completed}개`;

const map=document.getElementById("lesson-map");

lessons.forEach((lesson,index)=>{
  const unlocked=index===0 || stars[index-1]>=1;
  const earned=Math.max(0,Math.min(3,stars[index]||0));

  const item=document.createElement("div");
  item.className="lesson"+(unlocked?" active":"");

  const node=document.createElement("div");
  node.className="node";
  node.textContent=unlocked?"📖":"🔒";

  const title=document.createElement("h2");
  title.textContent=`제${lesson.number}과`;

  const chinese=document.createElement("div");
  chinese.className="chinese";
  chinese.textContent=index===0?lesson.title:"";

  const status=document.createElement("p");
  status.textContent=unlocked
    ?"학습할 수 있어요!"
    :"이전 과를 완료하면 열려요";

  const rating=document.createElement("div");
  rating.className="stars";
  rating.textContent="★".repeat(earned)+"☆".repeat(3-earned);

  item.append(node,title,chinese,status,rating);

  if(unlocked) {
    const link=document.createElement("a");
    link.className="start";
    link.href=`lesson.html?level=1&lesson=${lesson.number}`;
    link.textContent="학습 시작하기 →";
    item.append(link);
  }

  map.append(item);

  if(index<lessons.length-1) {
    const path=document.createElement("div");
    path.className="path";
    map.append(path);
  }
});
</script>
</body>
</html>
