
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새싹 마을 | 민쌤중국어 어휘랜드</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #fffcf7;
  color: #263b36;
  font-family: "Noto Sans KR", sans-serif;
}
header {
  background: white;
  border-bottom: 1px solid #e5eee9;
  padding: 17px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.logo {
  font-weight: 800;
  color: #0f766e;
  text-decoration: none;
}
.total { font-weight: 700; color: #8760bc; }
main { max-width: 1050px; margin: auto; padding: 26px 16px 50px; }
.heading { display: flex; justify-content: space-between; align-items: center; }
h1 { font-size: clamp(23px, 4vw, 34px); margin: 0; }
.sub { color: #71847c; margin: 8px 0 20px; }
.region-tag { background: #e3f5ee; color: #0f766e; padding: 8px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; }
.map {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 2;
  background: #9bce55 url("sprout-village.png") center / 100% 100% no-repeat;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 10px 30px #254f3420;
}

/* 입체적인 학습 별 버튼 */
.lesson {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 12%;
  aspect-ratio: 1;
  min-width: 42px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  filter: drop-shadow(0 7px 3px rgba(61, 42, 80, .35));
  transition: transform .22s ease, filter .22s ease;
  overflow: visible;
}

.lesson:not(:disabled):hover {
  transform: translate(-50%, -57%) scale(1.1);
  filter: drop-shadow(0 11px 5px rgba(61, 42, 80, .35));
}

.lesson:not(:disabled):active {
  transform: translate(-50%, -48%) scale(.96);
}

.lesson:disabled {
  cursor: not-allowed;
}

.star-shape {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: linear-gradient(
    145deg,
    #e6c6ff 0%,
    #b27aef 42%,
    #7844b6 100%
  );
  clip-path: polygon(
    50% 2%, 63% 32%, 97% 36%,
    72% 58%, 80% 94%, 50% 76%,
    20% 94%, 28% 58%, 3% 36%,
    37% 32%
  );
}

.star-shape::before {
  content: "";
  position: absolute;
  inset: 9%;
  background: linear-gradient(
    160deg,
    #f4e5ff 0%,
    #d8afff 35%,
    #a56de5 78%,
    #9560d5 100%
  );
  clip-path: inherit;
}

.star-shape::after {
  content: "";
  position: absolute;
  top: 15%;
  left: 29%;
  width: 40%;
  height: 18%;
  background: rgba(255,255,255,.65);
  border-radius: 50%;
  filter: blur(5px);
  transform: rotate(-15deg);
}

.number {
  position: relative;
  z-index: 2;
  color: white;
  font-weight: 900;
  font-size: clamp(18px, 3vw, 30px);
  text-shadow:
    0 2px 0 rgba(84,43,130,.7),
    0 3px 5px rgba(56,26,93,.3);
}

/* 잠긴 별: 부드러운 회보라색 */
.lesson.locked .star-shape {
  background: linear-gradient(
    145deg, #d6d0df, #9992ac 65%, #777185
  );
}

.lesson.locked .star-shape::before {
  background: linear-gradient(
    160deg, #e9e5ee, #c6bfd1 50%, #a49bb5
  );
}

.lesson.locked .number {
  font-size: clamp(19px, 3.2vw, 32px);
  text-shadow: 0 2px 3px rgba(50,40,60,.3);
}

/* 획득한 별 3개 표시 */
.rating {
  position: absolute;
  z-index: 3;
  bottom: -13px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  color: #ffce36;
  font-size: clamp(14px, 2.1vw, 23px);
  font-weight: 900;
  letter-spacing: 1px;
  -webkit-text-stroke: .6px #a97825;
  text-shadow:
    0 2px 0 #8c611f,
    0 3px 4px rgba(66,45,17,.4);
}

.lesson:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 4px;
  border-radius: 50%;
}

@media (prefers-reduced-motion: reduce) {
  .lesson { transition: none; }
}

.l1 { left: 23%; top: 35%; }
.l2 { left: 61%; top: 43%; }
.l3 { left: 31%; top: 60%; }
.l4 { left: 60%; top: 66%; }
.l5 { left: 72%; top: 84%; }
.regions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.region {
  flex: 1;
  text-align: center;
  padding: 14px 8px;
  border-radius: 14px;
  background: #f0f2ef;
  color: #8b9690;
  font-size: 14px;
  font-weight: 700;
}
.region.active { background: #dff4e9; color: #0f766e; }
.help { color: #708078; font-size: 13px; text-align: center; margin-top: 18px; }
@media(max-width:600px) {
  header { padding: 14px; font-size: 13px; }
  main { padding: 20px 10px; }
  .map { border-radius: 15px; }
  .regions { gap: 5px; }
  .region { font-size: 11px; padding: 12px 4px; }
  .rating { bottom: -6px; }
}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">🌿 민쌤중국어 어휘랜드</a>
  <span class="total" id="totalStars">⭐ 0 / 45</span>
</header>

<main>
  <div class="heading">
    <h1>🌱 새싹 마을</h1>
    <span class="region-tag">지역 1 / 3</span>
  </div>
  <p class="sub">HSK 1급 · 제1과 ~ 제5과</p>

  <div class="map" aria-label="새싹 마을 학습 지도">
    <button class="lesson l1" data-lesson="1" aria-label="제1과">
      <span class="star-shape"><span class="number">1</span></span>
      <span class="rating"></span>
    </button>
    <button class="lesson l2" data-lesson="2" aria-label="제2과">
      <span class="star-shape"><span class="number">2</span></span>
      <span class="rating"></span>
    </button>
    <button class="lesson l3" data-lesson="3" aria-label="제3과">
      <span class="star-shape"><span class="number">3</span></span>
      <span class="rating"></span>
    </button>
    <button class="lesson l4" data-lesson="4" aria-label="제4과">
      <span class="star-shape"><span class="number">4</span></span>
      <span class="rating"></span>
    </button>
    <button class="lesson l5" data-lesson="5" aria-label="제5과">
      <span class="star-shape"><span class="number">5</span></span>
      <span class="rating"></span>
    </button>
  </div>

  <div class="regions">
    <div class="region active">🌱 새싹 마을</div>
    <div class="region">💧 호수 마을 · 준비 중</div>
    <div class="region">✨ 별빛 산 · 준비 중</div>
  </div>
  <p class="help">⭐ 별 1개 이상을 획득하면 다음 과가 열려요!</p>
</main>

<script>
const KEY = "minssem-hsk1-progress";

function getStars() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    if (Array.isArray(saved.stars)) {
      return Array.from({length: 15}, (_, i) =>
        Math.max(0, Math.min(3, Number(saved.stars[i]) || 0))
      );
    }
  } catch (e) {
    console.warn("학습 기록을 읽지 못했습니다.", e);
  }
  return Array(15).fill(0);
}

function renderMap() {
  const stars = getStars();
  const total = stars.reduce((a, b) => a + b, 0);
  document.getElementById("totalStars").textContent =
    "⭐ " + total + " / 45";

  document.querySelectorAll(".lesson").forEach(button => {
    const n = Number(button.dataset.lesson);
    const unlocked = n === 1 || stars[n - 2] >= 1;
    const rating = stars[n - 1];

    button.disabled = !unlocked;
    button.classList.toggle("locked", !unlocked);
    button.querySelector(".number").textContent =
      unlocked ? n : "🔒";
    button.querySelector(".rating").textContent =
      unlocked ? "★".repeat(rating) + "☆".repeat(3 - rating) : "";
    button.setAttribute("aria-label",
      "제" + n + "과 " + (unlocked ? "학습하기" : "잠김"));

    button.onclick = () => {
      if (unlocked) {
        window.location.href =
          "lesson.html?level=1&lesson=" + n;
      }
    };
  });
}

renderMap();
window.addEventListener("pageshow", renderMap);
</script>
</body>
</html>
