
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 1급 · 새싹 마을 | 민쌤중국어 어휘랜드</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

:root {
  --bg: #f8faf9;
  --white: #ffffff;
  --dark: #263b36;
  --muted: #778981;
  --line: #e5ece8;
  --teal: #0f766e;
  --gold: #d3a044;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--dark);
  font-family: "Noto Sans KR", sans-serif;
}

button, a { font: inherit; }
button { cursor: pointer; }

button:focus-visible, a:focus-visible {
  outline: 3px solid #57b5a0;
  outline-offset: 3px;
}

[hidden] { display: none !important; }

.topbar {
  height: 68px;
  background: white;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 max(22px, calc((100vw - 1080px) / 2));
}

.brand {
  color: var(--teal);
  font-size: 15px;
  font-weight: 800;
  text-decoration: none;
}

.top-link {
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 42px 20px 80px;
}

.eyebrow {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--teal);
  margin: 0 0 9px;
}

h1 {
  font-size: clamp(27px, 5vw, 35px);
  line-height: 1.4;
  margin: 0;
  font-weight: 800;
}

.subtitle {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
  margin: 9px 0 0;
}

.section-title {
  font-size: 19px;
  font-weight: 800;
  margin: 30px 0 16px;
}

/* Header */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 27px;
}

.header-icon {
  width: 64px;
  height: 64px;
  background: #e8f6ef;
  border-radius: 19px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: var(--teal);
}

.header-icon svg {
  width: 32px;
  height: 32px;
}

/* Overall Progress */
.overall-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 23px;
}

.overall-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.overall-label {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 6px;
}

.overall-number {
  font-size: 21px;
  font-weight: 800;
}

.star-total {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--gold);
  font-size: 20px;
  font-weight: 800;
}

.star-total svg {
  width: 21px;
  height: 21px;
}

.progress-track {
  height: 9px;
  background: #e7eee9;
  border-radius: 99px;
  overflow: hidden;
  margin-top: 19px;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: var(--teal);
  border-radius: 99px;
  transition: width .3s ease;
}

.progress-caption {
  font-size: 12px;
  color: var(--muted);
  margin-top: 11px;
}

/* Area Cards */
.area-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.area-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 25px;
  transition: border-color .2s, transform .2s;
}

.area-card.unlocked:hover {
  transform: translateY(-2px);
  border-color: var(--area-color);
}

.area-card.locked {
  background: #fcfdfc;
}

.area-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;
}

.area-label {
  color: var(--area-color);
  font-size: 12px;
  font-weight: 800;
}

.area-title {
  font-size: 21px;
  font-weight: 800;
  margin: 6px 0 7px;
}

.area-description {
  font-size: 13px;
  line-height: 1.7;
  color: var(--muted);
  margin: 0;
}

.area-status {
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 800;
  border-radius: 99px;
  padding: 7px 11px;
  background: #e8f6ef;
  color: var(--teal);
}

.area-status.locked {
  background: #eef1ef;
  color: #98a69e;
}

/* Area Progress */
.area-progress {
  margin-top: 20px;
}

.area-progress-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
}

.area-progress-track {
  height: 7px;
  background: #e7eee9;
  border-radius: 99px;
  overflow: hidden;
  margin-top: 9px;
}

.area-progress-fill {
  height: 100%;
  width: 0;
  background: var(--area-color);
  border-radius: 99px;
  transition: width .3s ease;
}

/* Lesson List */
.lesson-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 22px;
}

.lesson-item {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 83px;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 14px 16px;
  background: #fff;
  text-decoration: none;
  color: var(--dark);
  transition: border-color .2s, background .2s;
}

.lesson-item.available:hover {
  border-color: var(--teal);
  background: #f4fbf7;
}

.lesson-item.locked {
  background: #f8faf9;
  color: #a4b0a9;
  cursor: not-allowed;
}

.lesson-number {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: #e8f6ef;
  color: var(--teal);
  font-size: 14px;
  font-weight: 800;
}

.lesson-item.locked .lesson-number {
  background: #edf1ee;
  color: #a4b0a9;
}

.lesson-info {
  flex: 1;
  min-width: 0;
}

.lesson-title {
  font-size: 14px;
  font-weight: 800;
  line-height: 1.5;
}

.lesson-subtitle {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

.lesson-item.locked .lesson-subtitle {
  color: #a4b0a9;
}

/* Lesson Stars */
.lesson-stars {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}

.lesson-stars svg {
  width: 17px;
  height: 17px;
}

.lesson-stars .filled {
  fill: var(--gold);
  stroke: var(--gold);
}

.lesson-stars .empty {
  fill: #e3e9e5;
  stroke: #e3e9e5;
}

/* Lesson Status */
.lesson-status {
  font-size: 12px;
  font-weight: 700;
  color: var(--teal);
  white-space: nowrap;
}

.lesson-item.locked .lesson-status {
  color: #a4b0a9;
}

.lesson-arrow {
  font-size: 22px;
  color: #9aa9a1;
  flex-shrink: 0;
}

.lesson-item.available:hover .lesson-arrow {
  color: var(--teal);
}

/* Locked Area Message */
.locked-message {
  margin-top: 20px;
  background: #f5f7f5;
  border: 1px dashed #dce5de;
  border-radius: 14px;
  padding: 17px;
  text-align: center;
  font-size: 12px;
  color: #91a099;
  line-height: 1.8;
}

.locked-message strong {
  display: block;
  color: #7d8c83;
  font-size: 13px;
  margin-bottom: 4px;
}

/* Bottom Navigation */
.bottom-navigation {
  margin-top: 28px;
  text-align: center;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--teal);
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
}

.back-link:hover {
  text-decoration: underline;
}

/* Responsive */
@media (max-width: 600px) {
  .topbar {
    height: 60px;
    padding: 0 17px;
  }

  .brand {
    font-size: 13px;
  }

  .container {
    padding: 28px 15px 55px;
  }

  .page-header {
    align-items: flex-start;
  }

  .header-icon {
    width: 52px;
    height: 52px;
    border-radius: 15px;
  }

  .header-icon svg {
    width: 27px;
    height: 27px;
  }

  .overall-card,
  .area-card {
    padding: 19px;
  }

  .lesson-item {
    gap: 10px;
    padding: 12px;
  }

  .lesson-number {
    width: 37px;
    height: 37px;
    border-radius: 11px;
  }

  .lesson-title {
    font-size: 13px;
  }

  .lesson-subtitle {
    font-size: 11px;
  }

  .lesson-stars svg {
    width: 14px;
    height: 14px;
  }

  .lesson-status {
    font-size: 11px;
  }
}

@media (max-width: 400px) {
  .lesson-status {
    display: none;
  }

  .lesson-item {
    gap: 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="index.html">
    🌿 민쌤중국어 어휘랜드
  </a>

  <a class="top-link" href="index.html">
    ← 메인으로
  </a>
</header>

<main class="container">

  <!-- PAGE HEADER -->

  <div class="page-header">

    <div>
      <p class="eyebrow">
        HSK LEVEL 1
      </p>

      <h1>🌱 새싹 마을</h1>

      <p class="subtitle">
        중국어 학습의 첫걸음!<br>
        15개의 레슨을 완료하고
        별 45개를 모아 보세요.
      </p>
    </div>

    <div class="header-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M12 22v-9"/>
        <path d="M12 13C6 13 3 9 3 3c6 0 9 4 9 10Z"/>
        <path d="M12 16c0-7 3-11 9-11 0 7-3 11-9 11Z"/>
      </svg>
    </div>

  </div>

  <!-- OVERALL PROGRESS -->

  <section class="overall-card"
    aria-label="전체 학습 진행률">

    <div class="overall-top">

      <div>
        <div class="overall-label">
          전체 학습 진행률
        </div>

        <div class="overall-number"
          id="overallProgressText">
          0 / 15 레슨 완료
        </div>
      </div>

      <div class="star-total">
        <svg viewBox="0 0 24 24"
          fill="currentColor"
          stroke="currentColor"
          aria-hidden="true">
          <path d="M12 2.5 15 8.7l6.8 1-4.9 4.8
            1.2 6.8L12 18.1l-6.1 3.2
            1.2-6.8-4.9-4.8 6.8-1L12 2.5Z"/>
        </svg>

        <span id="overallStars">
          0 / 45
        </span>
      </div>

    </div>

    <div class="progress-track">
      <div class="progress-fill"
        id="overallProgressFill"></div>
    </div>

    <div class="progress-caption"
      id="overallProgressCaption">
      첫 번째 레슨부터 시작해 보세요!
    </div>

  </section>

  <!-- AREA LIST -->

  <h2 class="section-title">
    🗺️ 학습 지도
  </h2>

  <div class="area-list" id="areaList">

    <!--
      JavaScript에서 3개 구역을 자동 생성합니다.

      AREA 1: 제1과 ~ 제5과
      AREA 2: 제6과 ~ 제10과
      AREA 3: 제11과 ~ 제15과

      각 레슨의 별, 잠금 상태, 이동 링크도
      저장된 학습 기록을 기준으로 생성됩니다.
    -->

  </div>

  <!-- BOTTOM NAVIGATION -->

  <nav class="bottom-navigation">
    <a class="back-link" href="index.html">
      ← 어휘랜드 메인으로 돌아가기
    </a>
  </nav>

</main>

<script>
"use strict";

/* ======================================
   HSK 1 MAP CONFIGURATION
====================================== */

const STORAGE_KEY = "minssem-hsk1-progress";
const TOTAL_LESSONS = 15;
const MAX_STARS = 3;
const TOTAL_STARS = TOTAL_LESSONS * MAX_STARS;

const areas = [
  {
    number: 1,
    title: "첫걸음 숲",
    description: "중국어의 기본 표현을 익혀요.",
    start: 1,
    end: 5,
    color: "#0f766e"
  },
  {
    number: 2,
    title: "성장 언덕",
    description: "더 다양한 단어를 배워요.",
    start: 6,
    end: 10,
    color: "#438d6b"
  },
  {
    number: 3,
    title: "도전 정원",
    description: "배운 표현을 활용해 보세요.",
    start: 11,
    end: 15,
    color: "#7d9a55"
  }
];

/* ======================================
   LESSON INFORMATION
====================================== */

const lessonTitles = [
  "AI小语，你好！",
  "제2과",
  "제3과",
  "제4과",
  "제5과",
  "제6과",
  "제7과",
  "제8과",
  "제9과",
  "제10과",
  "제11과",
  "제12과",
  "제13과",
  "제14과",
  "제15과"
];

// 현재 실제 단어 자료가 등록된 레슨
const availableLessons = new Set([1]);

function el(id) {
  return document.getElementById(id);
}

/* ======================================
   LEARNING PROGRESS
====================================== */

function readProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) {
      return Array(TOTAL_LESSONS).fill(0);
    }

    const parsed = JSON.parse(raw);

    if (!parsed || !Array.isArray(parsed.stars)) {
      return Array(TOTAL_LESSONS).fill(0);
    }

    return Array.from(
      { length: TOTAL_LESSONS },
      (_, index) => {
        const value = Number(parsed.stars[index]) || 0;

        return Math.max(
          0,
          Math.min(MAX_STARS, Math.floor(value))
        );
      }
    );

  } catch (error) {
    console.warn(
      "학습 기록을 불러올 수 없습니다.",
      error
    );

    return Array(TOTAL_LESSONS).fill(0);
  }
}

/* ======================================
   LESSON STATUS
====================================== */

function getLessonStars(lessonNumber, stars) {
  return stars[lessonNumber - 1] || 0;
}

function isLessonUnlocked(lessonNumber, stars) {
  // 첫 번째 레슨은 항상 열려 있어요.
  if (lessonNumber === 1) {
    return true;
  }

  // 이전 레슨에서 별 1개 이상 획득해야 해요.
  return getLessonStars(
    lessonNumber - 1,
    stars
  ) >= 1;
}

function isLessonAvailable(lessonNumber) {
  return availableLessons.has(lessonNumber);
}

function getLessonStatus(lessonNumber, stars) {
  const earnedStars = getLessonStars(
    lessonNumber,
    stars
  );

  const unlocked = isLessonUnlocked(
    lessonNumber,
    stars
  );

  const available = isLessonAvailable(
    lessonNumber
  );

  if (!unlocked) {
    return {
      type: "locked",
      label: "잠김",
      canEnter: false
    };
  }

  if (!available) {
    return {
      type: "comingSoon",
      label: "준비 중",
      canEnter: false
    };
  }

  if (earnedStars >= 1) {
    return {
      type: "completed",
      label: "복습하기",
      canEnter: true
    };
  }

  return {
    type: "available",
    label: "학습하기",
    canEnter: true
  };
}

/* ======================================
   OVERALL PROGRESS
====================================== */

function updateOverallProgress(stars) {
  const completedLessons = stars.filter(
    value => value >= 1
  ).length;

  const earnedStars = stars.reduce(
    (total, value) => total + value,
    0
  );

  const progressPercentage =
    completedLessons / TOTAL_LESSONS * 100;

  el("overallProgressText").textContent =
    `${completedLessons} / ${TOTAL_LESSONS} 레슨 완료`;

  el("overallStars").textContent =
    `${earnedStars} / ${TOTAL_STARS}`;

  el("overallProgressFill").style.width =
    `${progressPercentage}%`;

  if (completedLessons === TOTAL_LESSONS) {
    el("overallProgressCaption").textContent =
      "🎉 모든 레슨을 완료했어요! 축하합니다!";

  } else if (completedLessons > 0) {
    el("overallProgressCaption").textContent =
      `${completedLessons}개의 레슨을 완료했어요. 계속 도전해 보세요!`;

  } else {
    el("overallProgressCaption").textContent =
      "첫 번째 레슨부터 시작해 보세요!";
  }
}

/* ======================================
   AREA PROGRESS
====================================== */

function getAreaProgress(area, stars) {
  const areaStars = stars.slice(
    area.start - 1,
    area.end
  );

  const completed = areaStars.filter(
    value => value >= 1
  ).length;

  const earnedStars = areaStars.reduce(
    (total, value) => total + value,
    0
  );

  const totalLessons =
    area.end - area.start + 1;

  return {
    completed,
    totalLessons,
    earnedStars,
    maxStars: totalLessons * MAX_STARS,
    percentage: completed / totalLessons * 100
  };
}

function isAreaUnlocked(area, stars) {
  if (area.number === 1) {
    return true;
  }

  return isLessonUnlocked(
    area.start,
    stars
  );
}

/* ======================================
   STAR ICON
====================================== */

function createStarIcon(filled) {
  const className = filled ? "filled" : "empty";

  return `
    <svg class="${className}"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      aria-hidden="true">
      <path d="M12 2.5 15 8.7l6.8 1-4.9 4.8
        1.2 6.8L12 18.1l-6.1 3.2
        1.2-6.8-4.9-4.8 6.8-1L12 2.5Z"/>
    </svg>
  `;
}

function createLessonStars(earnedStars) {
  let html = "";

  for (let i = 0; i < MAX_STARS; i++) {
    html += createStarIcon(i < earnedStars);
  }

  return html;
}

/* ======================================
   LESSON ITEM
====================================== */

function createLessonItem(lessonNumber, stars) {
  const status = getLessonStatus(
    lessonNumber,
    stars
  );

  const earnedStars = getLessonStars(
    lessonNumber,
    stars
  );

  const title =
    lessonTitles[lessonNumber - 1] ||
    `제${lessonNumber}과`;

  const isAvailable = status.canEnter;

  const item = document.createElement(
    isAvailable ? "a" : "div"
  );

  item.className =
    `lesson-item ${isAvailable ? "available" : "locked"}`;

  if (isAvailable) {
    item.href = `lesson.html?lesson=${lessonNumber}`;
  }

  const number = document.createElement("div");
  number.className = "lesson-number";
  number.textContent = String(
    lessonNumber
  ).padStart(2, "0");

  const info = document.createElement("div");
  info.className = "lesson-info";

  const titleElement = document.createElement("div");
  titleElement.className = "lesson-title";
  titleElement.textContent = title;

  const subtitle = document.createElement("div");
  subtitle.className = "lesson-subtitle";

  if (status.type === "locked") {
    subtitle.textContent =
      "이전 레슨을 완료하면 열려요.";

  } else if (status.type === "comingSoon") {
    subtitle.textContent =
      "학습 자료를 준비하고 있어요.";

  } else if (status.type === "completed") {
    subtitle.textContent =
      "언제든지 다시 복습할 수 있어요.";

  } else {
    subtitle.textContent =
      "새로운 중국어 단어를 배워 보세요.";
  }

  info.appendChild(titleElement);
  info.appendChild(subtitle);

  const starsElement = document.createElement("div");
  starsElement.className = "lesson-stars";
  starsElement.setAttribute(
    "aria-label",
    `별 ${earnedStars}개 획득`
  );
  starsElement.innerHTML =
    createLessonStars(earnedStars);

  const statusElement = document.createElement("div");
  statusElement.className = "lesson-status";
  statusElement.textContent = status.label;

  const arrow = document.createElement("div");
  arrow.className = "lesson-arrow";
  arrow.textContent = isAvailable ? "›" : "🔒";

  if (status.type === "comingSoon") {
    arrow.textContent = "⏳";
  }

  item.appendChild(number);
  item.appendChild(info);
  item.appendChild(starsElement);
  item.appendChild(statusElement);
  item.appendChild(arrow);

  return item;
}

/* ======================================
   AREA CARD
====================================== */

function createAreaCard(area, stars) {
  const unlocked = isAreaUnlocked(area, stars);
  const progress = getAreaProgress(area, stars);

  const card = document.createElement("section");

  card.className =
    `area-card ${unlocked ? "unlocked" : "locked"}`;

  card.style.setProperty(
    "--area-color",
    area.color
  );

  const heading = document.createElement("div");
  heading.className = "area-heading";

  const headingInfo = document.createElement("div");

  const label = document.createElement("div");
  label.className = "area-label";
  label.textContent = `AREA ${area.number}`;

  const title = document.createElement("h3");
  title.className = "area-title";
  title.textContent = area.title;

  const description = document.createElement("p");
  description.className = "area-description";
  description.textContent = area.description;

  headingInfo.appendChild(label);
  headingInfo.appendChild(title);
  headingInfo.appendChild(description);

  const status = document.createElement("span");
  status.className =
    `area-status ${unlocked ? "" : "locked"}`;

  status.textContent =
    unlocked ? "탐험 가능" : "🔒 잠김";

  heading.appendChild(headingInfo);
  heading.appendChild(status);

  card.appendChild(heading);

  // 구역별 진행률
  const progressArea = document.createElement("div");
  progressArea.className = "area-progress";

  const progressTop = document.createElement("div");
  progressTop.className = "area-progress-top";

  const progressLabel = document.createElement("span");
  progressLabel.textContent =
    `${progress.completed} / ${progress.totalLessons} 레슨 완료`;

  const progressStars = document.createElement("span");
  progressStars.textContent =
    `⭐ ${progress.earnedStars} / ${progress.maxStars}`;

  progressTop.appendChild(progressLabel);
  progressTop.appendChild(progressStars);

  const track = document.createElement("div");
  track.className = "area-progress-track";

  const fill = document.createElement("div");
  fill.className = "area-progress-fill";
  fill.style.width = `${progress.percentage}%`;

  track.appendChild(fill);

  progressArea.appendChild(progressTop);
  progressArea.appendChild(track);

  card.appendChild(progressArea);

  // 레슨 목록
  const lessonList = document.createElement("div");
  lessonList.className = "lesson-list";

  for (
    let lessonNumber = area.start;
    lessonNumber <= area.end;
    lessonNumber++
  ) {
    lessonList.appendChild(
      createLessonItem(lessonNumber, stars)
    );
  }

  card.appendChild(lessonList);

  return card;
}

/* ======================================
   RENDER LEARNING MAP
====================================== */

function renderLearningMap() {
  const stars = readProgress();

  // 전체 학습 진행률 업데이트
  updateOverallProgress(stars);

  // 기존 구역 목록 초기화
  const areaList = el("areaList");
  areaList.innerHTML = "";

  // 3개 구역 자동 생성
  areas.forEach(area => {
    const areaCard = createAreaCard(area, stars);
    areaList.appendChild(areaCard);
  });
}

/* ======================================
   UPDATE PROGRESS ON RETURN
====================================== */

// 다른 페이지에서 돌아왔을 때
// 저장된 학습 기록을 다시 불러옵니다.
window.addEventListener("pageshow", () => {
  renderLearningMap();
});

// 다른 탭에서 학습 기록이 변경된 경우
// 현재 페이지에도 반영합니다.
window.addEventListener("storage", event => {
  if (event.key === STORAGE_KEY) {
    renderLearningMap();
  }
});

/* ======================================
   PAGE INITIALIZATION
====================================== */

renderLearningMap();

</script>
